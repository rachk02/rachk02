<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Apercu du README</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .pane { padding: 32px; }
  .light { background: #ffffff; color: #1f2328; }
  .dark { background: #0d1117; color: #e6edf3; }
  .inner { max-width: 880px; margin: 0 auto; }
  .tag { font: 600 11px/1 ui-monospace, monospace; letter-spacing: 1.5px; text-transform: uppercase; opacity: .55; margin: 0 0 18px; }
  img { max-width: 100%; }
  .hero, .full { display: block; width: 100%; margin: 0 0 16px; }
  .row { margin: 0 0 16px; white-space: nowrap; font-size: 0; }
  .row a { display: inline-block; width: 32.3%; margin-right: 1.55%; }
  .row a:last-child { margin-right: 0; }
  .row img { width: 100%; display: block; }
  .foot { font-size: 13px; margin: 18px 0 0; opacity: .8; }
</style>
</head>
<body>
  <section class="pane light">
    <div class="inner">
      <p class="tag">GitHub, theme clair</p>
      <img class="hero" src="cards/hero.svg" alt="Hero">
      <img class="full" src="cards/graph.svg" alt="Contributions">
      <img class="full" src="cards/activity.svg" alt="Rythme">
      <div class="row">
        <a href="#"><img src="cards/tile-ship.svg" alt="Kadenz"></a>
        <a href="#"><img src="cards/tile-guard.svg" alt="DNS Shield"></a>
        <a href="#"><img src="cards/tile-local.svg" alt="ODL PDF Studio"></a>
      </div>
      <p class="foot">Ouagadougou, Burkina Faso. elimmeka.com. rachid.fofana@elimmeka.com</p>
    </div>
  </section>
  <section class="pane dark">
    <div class="inner">
      <p class="tag">GitHub, theme sombre</p>
      <img class="hero" src="cards/hero.svg" alt="Hero">
      <img class="full" src="cards/graph.svg" alt="Contributions">
      <img class="full" src="cards/activity.svg" alt="Rythme">
      <div class="row">
        <a href="#"><img src="cards/tile-ship.svg" alt="Kadenz"></a>
        <a href="#"><img src="cards/tile-guard.svg" alt="DNS Shield"></a>
        <a href="#"><img src="cards/tile-local.svg" alt="ODL PDF Studio"></a>
      </div>
      <p class="foot">Ouagadougou, Burkina Faso. elimmeka.com. rachid.fofana@elimmeka.com</p>
    </div>
  </section>
</body>
</html>
